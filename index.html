<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Executive portfolio of Christopher Reyes Gómez — Data & BI Analyst, Technical Product Owner, and Oracle APEX & Flutter Developer. Founder at Lion Ruah Consulting S.A.">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            navy: {
              950: '#0B1120',
              900: '#0F172A',
              800: '#1E293B',
            },
            accent: {
              cyan: '#06B6D4',
              sky: '#38BDF8',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js via CDN for Interactive Data/BI Case Study Preview -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Subtle executive data-grid & ambient glow background */
    body {
      background-color: #0B1120;
      color: #E2E8F0;
      overflow-x: hidden;
    }

    .bg-data-grid {
      background-image:
        linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 44px 44px;
    }

    .hero-glow {
      background: radial-gradient(circle at 70% 20%, rgba(6, 182, 212, 0.14) 0%, rgba(15, 23, 42, 0) 55%),
                  radial-gradient(circle at 15% 80%, rgba(56, 189, 248, 0.09) 0%, rgba(11, 17, 32, 0) 50%);
    }

    /* Glassmorphic surface utility */
    .glass-card {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .glass-nav {
      background: rgba(11, 17, 32, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    /* Smooth card transitions */
    .project-card {
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .project-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 12px 32px -10px rgba(6, 182, 212, 0.18);
    }

    /* Custom scrollbar for dark mode */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0B1120;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-200 bg-data-grid">

            CR

            </svg>
            <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="
